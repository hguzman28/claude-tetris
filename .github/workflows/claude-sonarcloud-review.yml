name: Claude SonarCloud Analysis

# Fires whenever any GitHub Check Run completes. We filter below to only react
# to the SonarCloud check when its conclusion is a failure (Quality Gate not passed).
#
# NOTE: verify `github.event.check_run.app.slug` against your SonarCloud GitHub App
# installation (Settings > Integrations > GitHub Apps). 'sonarcloud' is the standard
# slug for SonarCloud's automatic analysis, but confirm it matches this org/repo.
on:
  check_run:
    types: [completed]

jobs:
  sonarcloud-analysis:
    if: |
      github.event.check_run.app.slug == 'sonarcloud' &&
      github.event.check_run.conclusion == 'failure' &&
      github.event.check_run.pull_requests[0] != null

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository at the analyzed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.check_run.head_sha }}
          fetch-depth: 1

      - name: Run Claude SonarCloud analysis
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Analysis-only: Claude must never edit/write files in this workflow.
          # Any fix has to go through a human-triggered @claude follow-up instead.
          claude_args: '--disallowed-tools Edit,Write,NotebookEdit'
          prompt: |
            El SonarCloud Quality Gate falló en el PR #${{ github.event.check_run.pull_requests[0].number }}
            del repo ${{ github.repository }} (commit ${{ github.event.check_run.head_sha }}).

            NO modifiques ningún archivo del repositorio. Tu único output permitido es UN
            comentario publicado en ese PR con el análisis de abajo (usa `gh pr comment`).

            ## 1. Contexto
            - Obtén el diff del PR: `gh pr diff ${{ github.event.check_run.pull_requests[0].number }}`.
            - Obtén el detalle del check de SonarCloud (issues flageados: regla, archivo,
              línea, severidad, tipo) vía `gh api` sobre el check run
              (`gh api repos/${{ github.repository }}/check-runs/${{ github.event.check_run.id }}`)
              y/o el comentario que el bot de SonarCloud haya dejado en el PR
              (`gh pr view ${{ github.event.check_run.pull_requests[0].number }} --json comments`).
            - Lee CLAUDE.md para entender arquitectura y convenciones del repo.

            ## 2. Qué reportó SonarCloud
            Resume cada issue: regla, severidad, archivo:línea, y por qué Sonar lo marcó.

            ## 3. Análisis de blast radius
            Para cada issue evalúa:
            - Qué tan aislado o central es el código afectado (ej. variable local sin uso
              vs. lógica de negocio compartida).
            - Qué otras funciones/módulos dependen de ese código (busca callers, imports, usos).
            - Si existen tests que cubran ese comportamiento.
            - Clasifica el blast radius como BAJO / MEDIO / ALTO, con la justificación.

            ## 4. Recomendación
            Para cada issue: ¿es seguro auto-resolverlo (BAJO blast radius, sin lógica de
            negocio involucrada) o requiere revisión humana (MEDIO/ALTO)? Justifica.

            Publica el análisis completo como comentario en el PR usando `gh pr comment
            ${{ github.event.check_run.pull_requests[0].number }} --body "..."`. No hagas
            ningún otro cambio.
