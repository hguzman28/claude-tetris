name: Claude SonarCloud Analysis

# Fires whenever any GitHub Check Run completes. We filter below to only react
# to the SonarQube Cloud check when its conclusion is a failure (Quality Gate not passed).
#
# Confirmed via `gh api repos/<repo>/commits/<sha>/check-runs` on this repo: the
# GitHub App that posts the Quality Gate check run has app.slug 'sonarqubecloud'
# (post-rebrand from "SonarCloud" to "SonarQube Cloud") and check name
# 'SonarCloud Code Analysis'. Don't confuse it with the separate
# 'github-advanced-security' check named "SonarCloud" (code scanning/SARIF results) —
# that one is unrelated to the Quality Gate and always ran green in our test PRs.
#
# NOTE: anthropics/claude-code-action@v1 does not support being invoked directly
# from a check_run event ("Unsupported event type: check_run" — confirmed by a
# live failed run on this repo). Instead of calling it here, this workflow posts
# an @claude PR comment with the analysis instructions, which re-triggers the
# existing claude.yml workflow (on: issue_comment containing '@claude'). That
# workflow already knows how to resolve full PR context.
on:
  check_run:
    types: [completed]

jobs:
  sonarcloud-analysis:
    if: |
      github.event.check_run.app.slug == 'sonarqubecloud' &&
      github.event.check_run.conclusion == 'failure' &&
      github.event.check_run.pull_requests[0] != null

    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Post @claude analysis request on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.check_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.check_run.head_sha }}
          CHECK_RUN_ID: ${{ github.event.check_run.id }}
        run: |
          cat > /tmp/sonar-analysis-request.md <<EOF
          @claude El SonarQube Cloud Quality Gate falló en este PR (commit ${HEAD_SHA}).

          NO modifiques ningún archivo del repositorio. Tu único output permitido es UN
          comentario de respuesta en este PR con el análisis de abajo (usa \`gh pr comment\`).

          ## 1. Contexto
          - Obtén el diff del PR: \`gh pr diff ${PR_NUMBER}\`.
          - Obtén el detalle del check de SonarQube Cloud (issues flageados: regla, archivo,
            línea, severidad, tipo) vía:
            \`gh api repos/${REPO}/check-runs/${CHECK_RUN_ID}\`
          - Lee CLAUDE.md para entender arquitectura y convenciones del repo.

          ## 2. Qué reportó SonarQube Cloud
          Resume cada issue: regla, severidad, archivo:línea, y por qué se marcó.

          ## 3. Análisis de blast radius
          Para cada issue evalúa:
          - Qué tan aislado o central es el código afectado (ej. variable local sin uso
            vs. lógica de negocio compartida).
          - Qué otras funciones/módulos dependen de ese código (busca callers, imports, usos).
          - Si existen tests que cubran ese comportamiento.
          - Clasifica el blast radius como BAJO / MEDIO / ALTO, con la justificación.

          ## 4. Recomendación
          Para cada issue: ¿es seguro auto-resolverlo (BAJO blast radius, sin lógica de
          negocio involucrada) o requiere revisión humana (MEDIO/ALTO)? Justifica.

          Publica el análisis completo como UN comentario en este PR. No hagas ningún
          otro cambio.
          EOF
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/sonar-analysis-request.md
